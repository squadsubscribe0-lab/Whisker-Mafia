/* ===================== CANVAS ART ===================== */
const OL = '#2b2433';
let LWID = 3;
const TAU = Math.PI * 2;
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function fs(g, fill, lw) { g.fillStyle = fill; g.fill(); g.lineWidth = lw || LWID; g.strokeStyle = OL; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
function fo(g, fill) { g.fillStyle = fill; g.fill(); }
function el(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }
function ci(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); }
function line(g, x1, y1, x2, y2, col, w) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.stroke(); }

/* ---------- weapon colours by level: 1 standard, 2 blue, 3 yellow, 4 golden ---------- */
function wcol(lvl, part, natural) {
  if (lvl >= 4) return { paint: '#ffcd38', metal: '#ffe48a', metal2: '#e9aa1e', gun: '#d79a1c', wood: '#7a4320', blade: '#fff1a6', dark: '#a8700f' }[part] || natural;
  if (lvl === 3) return { paint: '#f5cf3a', metal: '#f3dc78', metal2: '#cfae3a', gun: '#c99d22', wood: natural, blade: '#fff3b4', dark: '#3f3a4a' }[part] || natural;
  if (lvl === 2) return { paint: '#4ea2f0', metal: '#b5d2f4', metal2: '#6f95c6', gun: '#2f62a6', wood: natural, blade: '#d8eaff', dark: '#24467a' }[part] || natural;
  return natural;
}
function sparkle(g, x, y, s) {
  g.save(); g.translate(x, y); g.fillStyle = '#ffffff';
  g.beginPath(); g.moveTo(0, -s); g.quadraticCurveTo(0, 0, s, 0); g.quadraticCurveTo(0, 0, 0, s); g.quadraticCurveTo(0, 0, -s, 0); g.quadraticCurveTo(0, 0, 0, -s); g.fill(); g.restore();
}

/* ---------- in-battle weapons (origin = grip, pointing +x) ---------- */
function drawWeapon(g, type, x, y, sc, ang, lvl) {
  lvl = lvl || 1;
  const C = (part, nat) => wcol(lvl, part, nat);
  g.save(); g.translate(x, y); g.rotate(ang || 0); g.scale(sc, sc);
  const lw = LWID * 0.75;
  switch (type) {
    case 'knife':
      rr(g, -8, -3.4, 12, 6.8, 2.5); fs(g, C('dark', '#3f3a4a'), lw);
      rr(g, 3, -6, 3.5, 12, 1.5); fs(g, C('metal', '#a4abbc'), lw);
      g.beginPath(); g.moveTo(6.5, -3.6); g.lineTo(24, -3.2); g.quadraticCurveTo(31, -1, 32, 3.4); g.lineTo(6.5, 3.4); g.closePath(); fs(g, C('blade', '#e8edf4'), lw);
      break;
    case 'bat':
      g.beginPath(); g.moveTo(-6, -2.4); g.lineTo(16, -4.6); g.quadraticCurveTo(34, -6.5, 34, 0); g.quadraticCurveTo(34, 6.5, 16, 4.6); g.lineTo(-6, 2.4); g.closePath(); fs(g, C('paint', '#dfa463'), lw);
      line(g, 4, -1.2, 28, -3, 'rgba(255,255,255,.45)', 1.8);
      rr(g, -11, -3.1, 9, 6.2, 2.5); fs(g, '#3b3340', lw);
      break;
    case 'pistol':
      g.beginPath(); g.moveTo(-3, -3); g.lineTo(3, -2); g.lineTo(1, 10); g.quadraticCurveTo(-4, 11.5, -6.5, 9); g.closePath(); fs(g, C('wood', '#9a6238'), lw);
      rr(g, -1, -7.5, 25, 5.4, 1.6); fs(g, C('metal', '#9aa3b6'), lw);
      el(g, 6, -3.2, 5.2, 4.2); fs(g, C('gun', '#5f687c'), lw);
      break;
    case 'laser':
      g.beginPath(); g.moveTo(-3, -2); g.lineTo(3, -2); g.lineTo(1, 9); g.lineTo(-5, 8); g.closePath(); fs(g, C('gun', '#4d5363'), lw);
      rr(g, -4, -9, 22, 9, 4); fs(g, C('paint', '#e9eef5'), lw);
      rr(g, 17, -7.5, 10, 5, 2); fs(g, C('metal2', '#717b90'), lw);
      ci(g, 7, -4.5, 2.6); fo(g, lvl >= 4 ? '#fff6b0' : lvl === 3 ? '#fff17a' : lvl === 2 ? '#7fd0ff' : '#4de8ff');
      break;
    case 'grenade':
      rr(g, 4, -13, 8, 5, 1.5); fs(g, C('metal', '#9aa1b2'), lw);
      el(g, 8, 1, 9, 10); fs(g, C('paint', '#6f8f43'), lw);
      el(g, 5, -3, 2.5, 3.5); fo(g, 'rgba(255,255,255,.35)');
      break;
    case 'shotgun':
      g.beginPath(); g.moveTo(2, -4); g.lineTo(-14, -1); g.quadraticCurveTo(-17, 6, -14, 8); g.lineTo(3, 3.5); g.closePath(); fs(g, C('wood', '#9a6238'), lw);
      rr(g, 0, -6, 40, 4.6, 1.5); fs(g, C('metal', '#9aa3b6'), lw);
      rr(g, 12, -1.6, 16, 5.6, 2); fs(g, C('wood', '#a5683c'), lw);

/* ---------- shared helper for event-style SDKs ---------- */
function eventSdk(handlerName, queueName, pauseEv, startEv, readyEv, rewardEv) {
  return {
    rewardedOk: false, waiters: [],
    hook() {
      return new Promise(res => {
        let done = false; const ready = () => { if (!done) { done = true; res(); } };
        window[handlerName] = ev => {
          if (ev.name === readyEv) ready();
          if (ev.name === pauseEv) Ads.pause();
          if (ev.name === startEv) { Ads.resume(); this.waiters.splice(0).forEach(f => f()); }
          if (rewardEv && ev.name === rewardEv) this.rewardedOk = true;
        };
        (window[queueName] || []).forEach(window[handlerName]);
        setTimeout(ready, 5000);
      });
    },
    // resolves when the SDK says the game may continue, or quickly if no ad started
    waitResume() { return new Promise(res => { this.waiters.push(res); setTimeout(() => { if (!Ads.busy) res(); }, 2500); }); }
  };
}

const ADAPTERS = {

    ['coin', 'Coin Chest', `${Math.round(1000 * m)} coins`, 'gem100', 'g', () => { if (S.gems < 100) return toast('Not enough gems'); S.gems -= 100; grant({ coins: Math.round(1000 * m) }); refresh(); }],
  ];
  c.innerHTML = `<div class="o" style="position:absolute;top:24px;width:720px;text-align:center;font-size:54px">Black Market</div><div class="panel" style="left:24px;right:24px;top:110px;bottom:30px"><div class="list" id="shopList" style="left:0;right:0;top:0;bottom:0"></div></div>`;
  $('#shopList').innerHTML = offers.map((o, i) => `<div class="row"><div class="pic" style="background:#4a4565">${img(si(o[0]))}</div><div class="tx"><b>${o[1]}</b><span>${o[2]}</span></div><button class="b ${o[4]}" data-o="${i}">${o[3] === 'ad' ? `Free${icon('ad', 'ad')}` : o[3].startsWith('gem') ? `${icon('gem')}${o[3].slice(3)}` : o[3]}</button></div>`).join('');
  $$('[data-o]').forEach(b => tap(b, () => offers[+b.dataset.o][5]()));
}

/* ===================== MAIN ===================== */
const STAGE = $('#stage');
let SC = 1, SH = 1280;
function fit() {
  const vw = innerWidth, vh = innerHeight;
  SC = Math.min(vw / 720, vh / 1180);
  SH = Math.max(1180, Math.min(vh / SC, 1720));
  STAGE.style.height = SH + 'px';
  STAGE.style.transform = `translate(${(vw - 720 * SC) / 2}px,${Math.max(0, (vh - SH * SC) / 2)}px) scale(${SC})`;
  const touch = matchMedia('(pointer:coarse)').matches;
  $('#rotate').classList.toggle('on', touch && vw > vh * 1.15 && vh < 600);
}
function onResize() { fit(); if (gameOn) layoutGame(); else refresh(); }
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(onResize, 60); });
addEventListener('orientationchange', () => setTimeout(onResize, 250));

/* ---------- game buttons ---------- */
tap('#sumB', () => { if (!R || R.phase !== 'prep') return; if (R.cash < 20) return toast('Not enough cash. Defeat rats to earn more'); R.cash -= 20; summonThree(); });
tap('#adSumB', async () => { if (!R || R.phase !== 'prep' || R.adSummons <= 0) return; if (freeHand() < 0) return toast('Hand is full. Place or sell a card first'); if (await watchAd()) { R.adSummons--; summon(true); } });
tap('#fightB', startFight);
tap('#rocketB', fireRocket);
tap('#ab20', () => R && useAbility(20));
tap('#ab30', () => R && useAbility(30));
tap('#statsB', () => R && showStats());
tap('#pauseB', pauseGame);
tap('#addSlot', async () => { if (!R || R.handSlots > 3 || R.phase !== 'prep') return; if (await watchAd()) { R.handSlots = 4; R.hand[3] = rollItem(false); lastPop = R.hand[3].id; layoutGame(); } });
tap('#speedB', async () => {
  if (!R) return;
  if (!R.x2) { R.paused = true; const ok = await watchAd(); R.paused = false; if (!ok) return; R.x2 = true; R.speed = 2; renderHud(); return; }
  R.speed = R.speed === 1 ? 2 : 1; renderHud();
});

$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('#mbox').dataset.lock) closeModal(); });

/* ---------- loop ---------- */
let last = performance.now(), menuT = 0, dioT = 0, clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  if (gameOn && R && B) {
    if (!R.paused && !Ads.busy && R.phase !== 'done') for (let i = 0; i < R.speed; i++) update(dt);
    render();
    if (R.phase === 'battle') { loadersDOM(); if ((clock * 10 | 0) % 3 === 0) renderHud(); }
  } else if ($('#menu').classList.contains('on')) {
    dioT += dt; if (dioT > 1 / 30) { drawLobbyFrame(clock); dioT = 0; }
    menuT += dt; if (menuT > 1) { menuT = 0; if (!$('#modal').classList.contains('on')) renderTop(); }
  }
}
// tab hidden / minimized: pause, mute, stop gameplay event, save right away
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (gameOn && R && R.phase === 'battle' && !R.paused) pauseGame();
    try { if (Sfx.ctx) Sfx.ctx.suspend(); } catch (e) {}
    saveNow();
  } else { try { if (Sfx.ctx && !Ads.busy) Sfx.ctx.resume(); } catch (e) {} }
});
addEventListener('pagehide', saveNow);
document.addEventListener('pointerdown', () => Sfx.init(), { passive: true });
document.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (!gameOn || !R) return;
  const open = $('#modal').classList.contains('on');
  if ((e.code === 'Space' || e.code === 'Enter') && R.phase === 'prep' && !open) startFight();
  else if (e.code === 'KeyR' && !open) fireRocket();
  else if (e.code === 'Escape' || e.code === 'KeyP') { if (open && R.paused) { closeModal(); R.paused = false; Ads.gameplayStart(); } else if (!open) pauseGame(); }
});

/* ---------- boot ---------- */
(async function boot() {
  fit();
  const bar = $('#boot .lb i'), step = p => bar.style.width = p + '%';
  step(5);
  await Ads.init(); Ads.loadingStart(); step(30); Ads.loadingProgress(30);
  await loadSave(); step(45);
  cv = $('#cv'); ctx = cv.getContext('2d');
  try { await document.fonts.load('40px Lilita'); } catch (e) {}
  const jobs = [...TYPES.map(t => () => cardArt(t)), ...SKINS.map(s => () => catArt(s.id)), ...TRUCKS.map(t => () => truckArt(t.id)), ...Object.keys(PARTS).map(k => () => partArt(k)), () => avatarArt(S.avatar), () => bossArt(), () => makeBg(0)];
  for (let i = 0; i < jobs.length; i++) { jobs[i](); const pc = 45 + 50 * (i + 1) / jobs.length; step(pc); Ads.loadingProgress(pc); if (i % 4 === 3) await wait(0); }
  renderAvatar();
  tap('#avatar', () => { S.avatar = (S.avatar + 1) % AVATARS.length; save(); renderAvatar(true); });
  tap('#avPen', ev => { ev.stopPropagation(); editName(); });
  $('#menuBtn').innerHTML = icon('chevron');
  $('#pauseB').innerHTML = icon('pause');
  $('#statsB').innerHTML = icon('stats');
  $('#powTab').innerHTML = IC.powerTab + '<div></div>';
  $('#banner').innerHTML = IC.inkSplat + '<b></b>';
  $$('#tray .rust').forEach((r, i) => { r.innerHTML = IC.rust; r.style.cssText = `${i % 2 ? 'right' : 'left'}:0;${i > 1 ? 'bottom' : 'top'}:0;transform:scale(${i % 2 ? -1 : 1},${i > 1 ? -1 : 1})`; });
  buildNav();
  showScreen('menu'); setTab('lobby');
  step(100); await wait(150);
  $('#boot').remove();
  Ads.loadingStop();
  prefetchSounds();
  requestAnimationFrame(frame);
  if (S.runs === 0 && !S.tutDone) startTutorialRun();
})();

</script>
</body>
